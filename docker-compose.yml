version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: coffeeniche-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: coffeeniche_db
      MYSQL_USER: coffeeniche_user
      MYSQL_PASSWORD: coffeeniche_pass
    ports:
      - "3309:3306"
    volumes:
      - coffeeniche_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: coffeeniche-app
    container_name: coffeeniche-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: mysql://coffeeniche_user:coffeeniche_pass@mysql:3306/coffeeniche_db
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run db:seed && npm run build || true && npm start"

volumes:
  coffeeniche_mysql_data:
